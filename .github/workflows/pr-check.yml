name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: |
          xcodebuild test \
            -project ExportSchedule.xcodeproj \
            -scheme ExportSchedule \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'

  release-readiness:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump and release notes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          BASE_VERSION=$(git show "origin/${BASE_REF}:ExportSchedule.xcodeproj/project.pbxproj" | grep -m1 'MARKETING_VERSION' | sed -E 's/.*= (.*);/\1/')
          HEAD_VERSION=$(grep -m1 'MARKETING_VERSION' ExportSchedule.xcodeproj/project.pbxproj | sed -E 's/.*= (.*);/\1/')

          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::error::MARKETING_VERSION が更新されていません (現在: ${HEAD_VERSION})"
            exit 1
          fi
          echo "MARKETING_VERSION: ${BASE_VERSION} -> ${HEAD_VERSION}"

          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qx 'fastlane/metadata/ja/release_notes.txt'; then
            echo "release_notes.txt が更新されています"
          else
            echo "::error::fastlane/metadata/ja/release_notes.txt が更新されていません"
            exit 1
          fi
